<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Новый пользователь')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div th:replace="~{fragments :: hero('Администрирование', 'Новый пользователь')}"></div>
<main class="wrap content">
    <p class="muted">Для студента обязательны группа и курс, для организатора — контакты (они показываются в карточках его кружков).</p>
    <form class="form-card wide" th:action="@{/admin/users}" th:object="${userForm}" method="post">
        <label for="role">Роль</label>
        <select id="role" th:field="*{role}">
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.title}"></option>
        </select>

        <label for="username">Логин *</label>
        <input type="text" id="username" th:field="*{username}" maxlength="50">
        <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

        <label for="password">Пароль * (не менее 6 символов)</label>
        <input type="password" id="password" th:field="*{password}" maxlength="100">
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label for="fullName">ФИО *</label>
        <input type="text" id="fullName" th:field="*{fullName}" maxlength="150">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

        <label for="groupName">Группа (студент)</label>
        <input type="text" id="groupName" th:field="*{groupName}" maxlength="50">
        <div class="error" th:if="${#fields.hasErrors('groupName')}" th:errors="*{groupName}"></div>

        <label for="course">Курс (студент, 1–6)</label>
        <input type="number" id="course" th:field="*{course}" min="1" max="6">
        <div class="error" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>

        <label for="contacts">Контакты (организатор)</label>
        <input type="text" id="contacts" th:field="*{contacts}" maxlength="255">
        <div class="error" th:if="${#fields.hasErrors('contacts')}" th:errors="*{contacts}"></div>

        <div class="form-actions"><button type="submit" class="btn">Создать</button><a class="btn secondary" th:href="@{/admin/users}">Отмена</a></div>
    </form>
</main>
<footer><div class="wrap">Спорт ЧелГУ</div></footer>
</body>
</html>
