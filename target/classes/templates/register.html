<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Регистрация')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div th:replace="~{fragments :: hero('Регистрация', 'Создать аккаунт')}"></div>

<div class="auth-wrapper">
    <form class="form-card" th:action="@{/register}" th:object="${userForm}" method="post">
        <p class="muted" style="margin-top:0">Регистрация для студентов. Группа, курс и ФИО передаются организатору при записи на кружок. Аккаунты организаторов создаёт администратор.</p>

        <label for="fullName">ФИО <span class="label-hint">(Иванов Иван Иванович)</span></label>
        <input type="text" id="fullName" th:field="*{fullName}" maxlength="150" placeholder="Введите ваше ФИО">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

        <label for="username">Логин <span class="label-hint">(латинские буквы и цифры)</span></label>
        <input type="text" id="username" th:field="*{username}" maxlength="50" placeholder="Придумайте логин">
        <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

        <label for="password">Пароль <span class="label-hint">(не менее 6 символов)</span></label>
        <input type="password" id="password" th:field="*{password}" maxlength="100" placeholder="Придумайте пароль">
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label for="groupName">Группа <span class="label-hint">(например, ПМИ-101)</span></label>
        <input type="text" id="groupName" th:field="*{groupName}" maxlength="50" placeholder="Введите номер группы">
        <div class="error" th:if="${#fields.hasErrors('groupName')}" th:errors="*{groupName}"></div>

        <label for="course">Курс <span class="label-hint">(1–6)</span></label>
        <input type="number" id="course" th:field="*{course}" min="1" max="6" placeholder="Введите курс">
        <div class="error" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>

        <button type="submit" class="btn">Зарегистрироваться</button>

        <p class="auth-link">Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
    </form>
</div>

<footer><div class="wrap">Спорт ЧелГУ</div></footer>
</body>
</html>
