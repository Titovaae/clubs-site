<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Мероприятие')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div class="wrap">
    <h1 th:text="${event.id == null} ? 'Новое мероприятие' : 'Изменить мероприятие'"></h1>
    <p class="muted">Поля со звёздочкой (*) обязательны, остальные можно оставить пустыми.</p>
    <form th:action="@{/admin/events}" th:object="${event}" method="post">
        <input type="hidden" th:field="*{id}">

        <label for="name">Название *</label>
        <input type="text" id="name" th:field="*{name}" maxlength="150" required>
        <div class="error" th:errors="*{name}"></div>

        <label for="description">Описание *</label>
        <textarea id="description" th:field="*{description}" maxlength="2000" required></textarea>
        <div class="error" th:errors="*{description}"></div>

        <label for="eventDate">Дата *</label>
        <input type="date" id="eventDate" th:field="*{eventDate}" required>
        <div class="error" th:errors="*{eventDate}"></div>

        <label for="eventTime">Время *</label>
        <input type="time" id="eventTime" th:field="*{eventTime}" required>
        <div class="error" th:errors="*{eventTime}"></div>

        <label for="requirements">Требования</label>
        <textarea id="requirements" th:field="*{requirements}" maxlength="2000"></textarea>
        <div class="error" th:errors="*{requirements}"></div>

        <label for="place">Место *</label>
        <input type="text" id="place" th:field="*{place}" maxlength="255" required>
        <div class="error" th:errors="*{place}"></div>

        <label for="contacts">Контакты</label>
        <input type="text" id="contacts" th:field="*{contacts}" maxlength="255">
        <div class="error" th:errors="*{contacts}"></div>

        <p><button type="submit">Сохранить</button> <a class="btn" th:href="@{/admin}">Отмена</a></p>
    </form>
</div>
</body>
</html>
