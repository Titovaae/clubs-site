<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Редактирование')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<div class="wrap">
    <form class="inline" th:action="@{/logout}" method="post" style="float:right"><button type="submit">Выйти</button></form>
    <h1>Редактирование</h1>

    <h2>Кружки</h2>
    <p><a class="btn" th:href="@{/admin/clubs/new}">Добавить кружок</a></p>
    <table>
        <tr><th>Название</th><th>Организатор</th><th>Место</th><th>Действия</th></tr>
        <tr th:each="c : ${clubs}">
            <td th:text="${c.name}"></td>
            <td th:text="${c.organizer}"></td>
            <td th:text="${c.place}"></td>
            <td>
                <a th:href="@{/admin/clubs/{id}/edit(id=${c.id})}">Изменить</a>
                <form class="inline" th:action="@{/admin/clubs/{id}/delete(id=${c.id})}" method="post"
                      onsubmit="return confirm('Удалить кружок?');"><button type="submit">Удалить</button></form>
            </td>
        </tr>
    </table>

    <h2>Мероприятия</h2>
    <p><a class="btn" th:href="@{/admin/events/new}">Добавить мероприятие</a></p>
    <table>
        <tr><th>Название</th><th>Дата</th><th>Время</th><th>Место</th><th>Действия</th></tr>
        <tr th:each="e : ${events}">
            <td th:text="${e.name}"></td>
            <td th:text="${#temporals.format(e.eventDate, 'dd.MM.yyyy')}"></td>
            <td th:text="${#temporals.format(e.eventTime, 'HH:mm')}"></td>
            <td th:text="${e.place}"></td>
            <td>
                <a th:href="@{/admin/events/{id}/edit(id=${e.id})}">Изменить</a>
                <form class="inline" th:action="@{/admin/events/{id}/delete(id=${e.id})}" method="post"
                      onsubmit="return confirm('Удалить мероприятие?');"><button type="submit">Удалить</button></form>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
