<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Вход')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<div class="hero" style="padding-bottom: 40px;">
    <div class="wrap">
        <div class="breadcrumbs">
            <a href="/">Главная</a> &nbsp;&gt;&nbsp; Вход
        </div>
        <h1 class="auth-title">Вход в систему</h1>
    </div>
</div>

<div class="auth-wrapper">
    <!-- ВОТ ЗДЕСЬ ДОБАВЛЕН class="form-card" -->
    <form class="form-card" th:action="@{/login}" method="post">

        <div th:if="${param.error}" class="error block">
            Неверный логин или пароль.
        </div>

        <div th:if="${param.registered}" class="success">
            Регистрация прошла успешно. Войдите в свой аккаунт.
        </div>

        <div th:if="${param.logout}" class="success">
            Вы успешно вышли из системы.
        </div>

        <div>
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" placeholder="Введите ваш логин" required autofocus>
        </div>

        <div>
            <label for="password">Пароль</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" placeholder="Введите ваш пароль" required>

                <!-- Глазик -->
                <span class="toggle-password" onclick="togglePassword('password')">
                    <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="icon-eye-off hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </span>
            </div>
        </div>

        <button type="submit" class="btn">Войти</button>

        <p class="auth-link">
            Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
        </p>
    </form>
</div>

<footer><div class="wrap">Спорт ЧелГУ</div></footer>

<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const wrapper = input.nextElementSibling;
        const iconEye = wrapper.querySelector('.icon-eye');
        const iconEyeOff = wrapper.querySelector('.icon-eye-off');

        if (input.type === "password") {
            input.type = "text";
            iconEye.classList.add('hidden');
            iconEyeOff.classList.remove('hidden');
        } else {
            input.type = "password";
            iconEye.classList.remove('hidden');
            iconEyeOff.classList.add('hidden');
        }
    }
</script>
</body>
</html>
