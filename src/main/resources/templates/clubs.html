<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Кружки')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<div class="hero">
    <div class="wrap">
        <div class="breadcrumbs">
            <a href="/">Главная</a> &nbsp;&gt;&nbsp; Кружки и секции
        </div>
        <h1>Кружки и секции</h1>

        <!-- ФИЛЬТРЫ: Оставили только Все, Спорт и Творчество. У "Все" нет стрелки -->
        <div class="filters" th:if="${!clubs.empty}">
            <button class="filter-btn no-arrow active" data-filter="all">
                Все
            </button>
            <button class="filter-btn" data-filter="sport">
                Спорт <span class="arrow-circle">→</span>
            </button>
            <button class="filter-btn" data-filter="creativity">
                Творчество <span class="arrow-circle">→</span>
            </button>
        </div>
    </div>
</div>

<div class="wrap">
    <p class="muted" th:if="${clubs.empty}" style="margin-top: 30px;">Кружков пока нет.</p>

    <div class="clubs-grid" id="clubs-container">
        <!-- ЛОГИКА: Теперь распределяем по 2 категориям (% 2 == 0 - спорт, иначе - творчество) -->
        <a class="card" th:each="c, stat : ${clubs}"
           th:href="@{/clubs/{id}(id=${c.id})}"
           th:attr="data-category=${stat.index % 2 == 0 ? 'sport' : 'creativity'}">

            <div class="thumb"></div>

            <div class="card-body">
                <h3 th:text="${c.name}"></h3>
                <p th:text="${#strings.abbreviate(c.description, 120)}"></p>
                <div class="card-link-text">Подробнее →</div>
            </div>
        </a>
    </div>

    <!-- ПАГИНАЦИЯ (Оформление исправлено в CSS, здесь структура осталась прежней) -->
    <p class="pager" th:if="${totalPages > 1}">
        <a th:if="${page > 1}" th:href="@{/clubs(page=${page - 1})}">← Назад</a>
        <span th:each="p : ${#numbers.sequence(1, totalPages)}">
            <b th:if="${p == page}" th:text="${p}"></b>
            <a th:unless="${p == page}" th:href="@{/clubs(page=${p})}" th:text="${p}"></a>
        </span>
        <a th:if="${page < totalPages}" th:href="@{/clubs(page=${page + 1})}">Вперёд →</a>
    </p>
</div>

<footer><div class="wrap">Спорт ЧелГУ</div></footer>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const filterButtons = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.card');

        filterButtons.forEach(button => {
            button.addEventListener('click', function() {
                filterButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                const filterValue = this.getAttribute('data-filter');

                cards.forEach(card => {
                    if (filterValue === 'all' || card.getAttribute('data-category') === filterValue) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    });
</script>
</body>
</html>
