<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Спорт ЧелГУ'">Спорт ЧелГУ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header">
    <div class="wrap header-top">
        <span class="title">ЧелГУ: Спорт и Кружки</span>
        <nav>
            <!-- Основные ссылки -->
            <a th:href="@{/}" class="nav-btn btn-main">Мероприятия</a>
            <a th:href="@{/clubs}" class="nav-btn btn-main">Кружки</a>
            <a sec:authorize="hasRole('STUDENT')" th:href="@{/student/notifications}" class="nav-btn btn-main">Уведомления</a>
            <a sec:authorize="hasRole('ORGANIZER')" th:href="@{/organizer}" class="nav-btn btn-main">Мои кружки</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}" class="nav-btn btn-main">Пользователи</a>

            <!-- Разделитель -->
            <span sec:authorize="!isAuthenticated()" class="nav-divider"></span>

            <!-- Кнопки авторизации -->
            <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="nav-btn btn-outline">Войти</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/register}" class="nav-btn btn-primary">Регистрация</a>

            <!-- Блок авторизованного пользователя -->
            <span sec:authorize="isAuthenticated()" style="display:flex; align-items:center; gap:15px; margin-left: 10px;">
                <span class="nav-divider" style="margin: 0;"></span>
                <span style="color: rgba(255,255,255,0.7); font-size: 0.9rem;" sec:authentication="name"></span>
                <form class="inline" th:action="@{/logout}" method="post">
                    <button type="submit" class="nav-btn btn-outline">Выйти</button>
                </form>
            </span>
        </nav>
    </div>
</header>
</body>
</html>
