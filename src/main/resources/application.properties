spring.datasource.url=jdbc:postgresql://localhost:5432/clubs_db
spring.datasource.username=postgres
spring.datasource.password=123456

# Таблицы создаются автоматически при первом запуске
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Логин и пароль администратора (ОБЯЗАТЕЛЬНО поменяйте)
app.admin.username=admin
app.admin.password=admin123

# Заполнить пустую базу тестовыми данными (кружки ЧелГУ).
# Когда начнёте вносить реальные данные, поставьте false.
app.seed-test-data=true
